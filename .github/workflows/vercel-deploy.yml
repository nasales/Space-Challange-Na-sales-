# Deploys main to Vercel through a Deploy Hook.
# Why: the repo is private and the Vercel project is on Hobby, so Vercel's own Git
# integration blocks every commit whose author has no access to the project.
# A Deploy Hook deploys the latest main without that author check.
#
# Setup (owner of the Vercel project, once):
#   1. Vercel > project > Settings > Git > Deploy Hooks > name "main", branch "main" > Create.
#   2. GitHub > repo > Settings > Secrets and variables > Actions > New repository secret:
#      name VERCEL_DEPLOY_HOOK_URL, value = the hook URL. Never commit the URL (anyone with it can deploy).
name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch: # manual "Run workflow" button in the Actions tab

# If several merges land close together, only the newest one triggers a deploy.
concurrency:
  group: vercel-deploy
  cancel-in-progress: true

permissions: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger Vercel deploy hook
        env:
          HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK_URL" ]; then
            echo "::error::Secret VERCEL_DEPLOY_HOOK_URL is not set (see the setup notes at the top of this file)."
            exit 1
          fi
          curl --fail --silent --show-error --retry 3 -X POST "$HOOK_URL"
          echo
          echo "Deploy requested. Follow it in the Vercel dashboard > Deployments."
